services:
  app_proxy:
    environment:
      APP_HOST: holyarrs_server_1
      APP_PORT: 6262

  server:
    image: holyarrs/holyarrs:1.3.0@sha256:0c15e13f3d96c6f39325188b5e90a7c99181a0dcdb1069db30f3441168840722
    restart: on-failure
    hostname: "${DEVICE_HOSTNAME}"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
      - HOLYARRS_TRUSTED_PROXIES=${NETWORK_IP}/16
      - HOLYARRS_ALLOWED_HOSTS=${DEVICE_DOMAIN_NAME},${DEVICE_HOSTNAME}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/media:/media
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    healthcheck:
      test: ["CMD", "/holyarrs", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
